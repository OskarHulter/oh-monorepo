packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  fallow: true

catalog:
  '@changesets/cli': ^2.31.0
  '@commitlint/cli': ^20.5.0
  '@commitlint/config-conventional': ^20.5.0
  '@varlock/vite-integration': ^0.2.10
  fallow: ^2.48.4
  pino: ^10.3.1
  playwright: ^1.59.1
  rimraf: ^6.1.3
  varlock: ^0.9.1
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  zod: ^4.3.6

catalogMode: prefer

cleanupUnusedCatalogs: true
linkWorkspacePackages: true
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
preferWorkspacePackages: true
