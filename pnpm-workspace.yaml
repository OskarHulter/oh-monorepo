packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  fallow: true

catalog:
  '@changesets/cli': ^2.31.1
  '@commitlint/cli': ^20.5.2
  '@commitlint/config-conventional': ^20.5.0
  '@tailwindcss/vite': ^4.2.2
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.0.3
  '@varlock/vite-integration': ^0.2.10
  '@vitejs/plugin-react': ^6.0.3
  fallow: ^2.52.0
  pino: ^10.3.1
  playwright: ^1.59.1
  react: ^19.2.7
  react-dom: ^19.2.7
  rimraf: ^6.1.3
  tailwindcss: ^4.2.2
  varlock: ^0.9.1
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  zod: ^4.3.6

catalogMode: prefer

cleanupUnusedCatalogs: true
linkWorkspacePackages: true
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
preferWorkspacePackages: true
