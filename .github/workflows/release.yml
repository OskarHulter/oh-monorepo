name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: voidzero-dev/setup-vp@b69666a3d815beb21ce968bbfc9c17e63973986b # v1.8.0
        with:
          cache: true

      - name: Create Release Pull Request
        uses: changesets/action@e0538b8a44d9247402592e0ce6c1e1d31bb8eed4 # v1.5.4
        with:
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
