name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          filter: tree:0
      - uses: voidzero-dev/setup-vp@b69666a3d815beb21ce968bbfc9c17e63973986b # v1.8.0
        with:
          cache: true
      - uses: dmno-dev/varlock-action@e1f2cd2307d6aa069e71958ce2857cc947fbc1ec # v1.0.2
        with:
          working-directory: apps/website
      - run: vp check
      - run: vp run -r test
      - run: vp run -r build
