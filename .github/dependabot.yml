version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Toolchain owner — bumps are coupled to local vp version. Manual control.
      - dependency-name: voidzero-dev/setup-vp
      # Gemini agent behavior changes between minors. Pin manually.
      - dependency-name: google-github-actions/run-gemini-cli

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Patch updates across the workspace land as a single PR. Low-risk, weekly cadence.
      npm-patch:
        update-types: [patch]
      # @types/* peers move together with their runtime.
      types:
        patterns: ['@types/*']
        update-types: [minor, patch]
    ignore:
      # Vite+ wraps Vite/Vitest/Rolldown/tsdown/Oxlint/Oxfmt — bumps come with `vp upgrade`.
      - dependency-name: vite-plus
      - dependency-name: '@voidzero-dev/*'
      # React majors are deliberate, manual.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
