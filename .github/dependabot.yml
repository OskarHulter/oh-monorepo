version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Toolchain owner — bumps are coupled to local vp version. Manual control.
      - dependency-name: voidzero-dev/setup-vp
      # Gemini agent behavior changes between minors. Pin manually.
      - dependency-name: google-github-actions/run-gemini-cli

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # @types/* peers move together with their runtime. Listed first so type
      # patches consolidate here instead of being absorbed by `npm-patch`.
      types:
        patterns: ['@types/*']
        update-types: [minor, patch]
      # Patch updates across the workspace land as a single PR. Low-risk, weekly cadence.
      npm-patch:
        update-types: [patch]
    ignore:
      # Vite+ wraps Vite/Vitest/Rolldown/tsdown/Oxlint/Oxfmt — bumps come with `vp upgrade`.
      - dependency-name: vite-plus
      - dependency-name: '@voidzero-dev/*'
      # React majors are deliberate, manual.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # Type peers mirror their runtime — React/Node majors are manual.
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript majors shift lib.d.ts and strictness — coordinated bump.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # tsgo preview — fast-moving, owned by the TS team's rollout cadence.
      - dependency-name: '@typescript/native-preview'
      # Tailwind v3→v4 was a rewrite; majors land deliberately.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: '@tailwindcss/vite'
        update-types: [version-update:semver-major]
      # Playwright majors ship coordinated browser snapshot bumps.
      - dependency-name: playwright
        update-types: [version-update:semver-major]
      # zod v3→v4 was breaking; majors are reviewed in isolation.
      - dependency-name: zod
        update-types: [version-update:semver-major]
      # Logging API stability matters — pino majors land deliberately.
      - dependency-name: pino
        update-types: [version-update:semver-major]
      # varlock owns its own major rollout cadence.
      - dependency-name: varlock
        update-types: [version-update:semver-major]
      - dependency-name: '@varlock/*'
        update-types: [version-update:semver-major]
