'app: website':
  - changed-files:
      - any-glob-to-any-file: 'apps/website/**/*'
'package: client':
  - changed-files:
      - any-glob-to-any-file: 'packages/client/**/*'
'package: server':
  - changed-files:
      - any-glob-to-any-file: 'packages/server/**/*'
'package: shared':
  - changed-files:
      - any-glob-to-any-file: 'packages/shared/**/*'
'package: utils':
  - changed-files:
      - any-glob-to-any-file: 'packages/utils/**/*'
'area: ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - 'labeler-config.yml'
'area: config':
  - changed-files:
      - any-glob-to-any-file:
          - 'vite.config.ts'
          - 'tsconfig.json'
          - 'pnpm-workspace.yaml'
          - '.vscode/**/*'
'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'AGENTS.md'
'area: deps':
  - changed-files:
      - any-glob-to-any-file:
          - '**/package.json'
          - 'pnpm-lock.yaml'
